adapter driver jlink

transport select jtag

reset_config trst_and_srst

adapter speed 200
jtag_ntrst_delay 500

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME hwd10909
    # set _CHIPNAME Cortex-A53
}


# main dap
if { [info exists DAP_TAPID] } {
   set _DAP_TAPID $DAP_TAPID
} else {
   set _DAP_TAPID 0x5ba00477
}

jtag newtap $_CHIPNAME tap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_DAP_TAPID -enable
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.tap

set _TARGETNAME $_CHIPNAME.a53
set _CTINAME $_CHIPNAME.cti

set DBGBASE {0x80F10000 0x80E10000 0x80D10000 0x80C10000}
set CTIBASE {0x80F20000 0x80E20000 0x80D20000 0x80C20000}
set _cores 4

for {set _core 0} {$_core < $_cores} {incr _core} {
    cti create $_CTINAME.cti$_core \
	-dap $_CHIPNAME.dap \
	-ap-num 1 \
	-baseaddr [lindex $CTIBASE $_core]

    target create $_TARGETNAME.core$_core\
	aarch64 -dap $_CHIPNAME.dap\
        -coreid $_core \
	-dbgbase [lindex $DBGBASE $_core] \
	-cti $_CTINAME.cti$_core

    $_TARGETNAME.core$_core configure -event reset-assert-post "aarch64 dbginit"
    $_TARGETNAME.core$_core configure -event gdb-attach {
	init
	halt
    }
}
# only one gdb instance is created
# master: $_TARGETNAME.core0
# slave: $_TARGETNAME.core1 $_TARGETNAME.core2 $_TARGETNAME.core3
# target smp  $_TARGETNAME.core1 $_TARGETNAME.core2 $_TARGETNAME.core3
